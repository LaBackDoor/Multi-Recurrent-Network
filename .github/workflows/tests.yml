name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8
        with:
          version: "latest"

      - name: Install dependencies (CPU torch via test group)
        # UV_INDEX_PYTORCH_CU130 redirects the named pytorch-cu130 index to
        # CPU wheels at runtime — same lock file, no CUDA drivers needed in CI.
        run: uv sync --group test
        env:
          UV_INDEX_PYTORCH_CU130: https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: uv run pytest test/ -v --tb=short
