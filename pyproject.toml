[project]
name = "multi-recurrent-network"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=25.12.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.251201",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    # torch.compile needs Triton. On Linux, `torch` pulls it in itself; on
    # Windows it ships as a separate wheel. Declaring it here (behind the
    # marker) makes `uv sync` give both platforms the same capability. Keep the
    # minor version aligned with torch: 2.9 <-> triton 3.5.
    "triton-windows>=3.5,<3.6 ; sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
